name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The NetFwTypeLib COM reference needs the .NET Framework MSBuild
      # (ResolveComReference is not supported by dotnet build).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild src/MinimalFirewall.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild src/MinimalFirewall.sln /t:Build /p:Configuration=Release /p:Platform=x64

      # The solution is built with MSBuild because of NetFwTypeLib. Reuse the
      # already-built test assembly so dotnet test does not invoke dotnet build.
      # Keep the same x64 platform so dotnet test resolves the MSBuild output
      # under bin\\x64\\Release.
      - name: Unit tests
        run: dotnet test tests/MinimalFirewall.Tests/MinimalFirewall.Tests.csproj --no-build --no-restore --configuration Release --property:Platform=x64 --settings .github/coverage.runsettings --results-directory TestResults --collect:"Code Coverage;Format=Cobertura" --logger "console;verbosity=normal"

      - name: Summarize code coverage
        if: success()
        shell: pwsh
        env:
          # Baseline from two successful Windows runs: 12.97% lines / 10.61% branches.
          # Keep a buffer for routine changes outside covered business paths.
          MIN_LINE_COVERAGE: "10"
          MIN_BRANCH_COVERAGE: "8"
        run: .github/scripts/write-coverage-summary.ps1

      - name: Upload Cobertura coverage artifact
        if: ${{ always() && hashFiles('TestResults/**/*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-cobertura-${{ github.run_number }}
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14
