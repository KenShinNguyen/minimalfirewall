name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The NetFwTypeLib COM reference needs the .NET Framework MSBuild
      # (ResolveComReference is not supported by `dotnet build`).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild src/MinimalFirewall.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild src/MinimalFirewall.sln /t:Build /p:Configuration=Release /p:Platform=x64

      # The solution is built with MSBuild because of NetFwTypeLib. Reuse the
      # already-built test assembly so dotnet test does not invoke dotnet build.
      - name: Unit tests
        run: dotnet test tests/MinimalFirewall.Tests/MinimalFirewall.Tests.csproj --no-build --no-restore --configuration Release --logger "console;verbosity=normal"
